  # Game Backend API
  game-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    depends_on:
      - flux-service
      - ollama-service
    environment:
      - FLUX_SERVICE_URL=http://flux-service:8000
      - OLLAMA_SERVICE_URL=http://ollama-service:11434
    volumes:
      - ./game_data:/app/game_data
      - ./assets:/app/assets

  # Flux Image Generation Service
  flux-service:
    build:
      context: ./flux-service
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./models:/app/models
      - ./assets:/app/outputs
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
      - HF_MODEL_REPO=${HF_MODEL_REPO:-black-forest-labs/FLUX.1-dev}
      - HF_CACHE_DIR=${HF_CACHE_DIR:-/app/models}
      - HF_HUB_DISABLE_TELEMETRY=${HF_HUB_DISABLE_TELEMETRY:-1}
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ollama LLM Service
  ollama-service:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ./ollama_data:/root/.ollama
    entrypoint: ['/bin/bash', '-c']
    command: >
      "ollama serve &
       sleep 10 &&
       ollama pull gemma3:27b &&
       wait"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
